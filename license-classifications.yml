# License Classifications
#
# ORT uses two separate sections:
#   categories:       defines the category names (and optional descriptions)
#   categorizations:  maps each SPDX license ID to one or more categories
#
# The evaluator.rules.kts can reference categories by name.
# Full reference: https://oss-review-toolkit.org/docs/configuration/license-classifications

categories:
  - name: "permissive"
  - name: "copyleft"
  - name: "strong-copyleft"
  - name: "commercial"
  - name: "free-restricted"

categorizations:
  # ── Permissive ───────────────────────────────────────────────────────────────
  - id: "MIT"
    categories: ["permissive"]
  - id: "Apache-2.0"
    categories: ["permissive"]
  - id: "BSD-2-Clause"
    categories: ["permissive"]
  - id: "BSD-3-Clause"
    categories: ["permissive"]
  - id: "ISC"
    categories: ["permissive"]
  - id: "0BSD"
    categories: ["permissive"]
  - id: "Unlicense"
    categories: ["permissive"]
  - id: "CC0-1.0"
    categories: ["permissive"]
  - id: "Zlib"
    categories: ["permissive"]
  - id: "PSF-2.0"
    categories: ["permissive"]

  # ── Weak copyleft ─────────────────────────────────────────────────────────────
  - id: "LGPL-2.0-only"
    categories: ["copyleft"]
  - id: "LGPL-2.0-or-later"
    categories: ["copyleft"]
  - id: "LGPL-2.1-only"
    categories: ["copyleft"]
  - id: "LGPL-2.1-or-later"
    categories: ["copyleft"]
  - id: "LGPL-3.0-only"
    categories: ["copyleft"]
  - id: "LGPL-3.0-or-later"
    categories: ["copyleft"]
  - id: "MPL-2.0"
    categories: ["copyleft"]
  - id: "EPL-1.0"
    categories: ["copyleft"]
  - id: "EPL-2.0"
    categories: ["copyleft"]
  - id: "EUPL-1.2"
    categories: ["copyleft"]

  # ── Strong copyleft ───────────────────────────────────────────────────────────
  - id: "GPL-2.0-only"
    categories: ["strong-copyleft"]
  - id: "GPL-2.0-or-later"
    categories: ["strong-copyleft"]
  - id: "GPL-3.0-only"
    categories: ["strong-copyleft"]
  - id: "GPL-3.0-or-later"
    categories: ["strong-copyleft"]
  - id: "AGPL-3.0-only"
    categories: ["strong-copyleft"]
  - id: "AGPL-3.0-or-later"
    categories: ["strong-copyleft"]
  - id: "SSPL-1.0"
    categories: ["strong-copyleft"]

  # ── Free but restricted ───────────────────────────────────────────────────────
  - id: "BUSL-1.1"
    categories: ["free-restricted"]
